name: tests

on:
  push:
  pull_request:

jobs:
  # The no-browser tests and lint: cheap, and the same on any operating system.
  unit-and-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Unit tests and lint
        run: npm run test:quick

  # Every browser test file, in 3 parts that run at the same time (run.js --shard splits them without overlap).
  # If the number of parts changes, change the matrix and the /3 below together (tools/tests/run-shards.test.js checks this).
  browser:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install the Playwright browser
        run: npx playwright install chromium
      - name: Browser tests, part ${{ matrix.shard }} of 3
        run: node tools/tests/run.js browser --shard=${{ matrix.shard }}/3

  # The real tag writer (node-taglib-sharp) on real audio files, compared with the Python backend (mutagen). XPLAYER_REQUIRE_REAL_TAGS=1
  # makes a missing package a failure instead of a skip, so these tests cannot be skipped unnoticed. Needs node-taglib-sharp in
  # package.json and package-lock.json (npm install node-taglib-sharp).
  real-tags:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      XPLAYER_REQUIRE_REAL_TAGS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install mutagen (the Python backend the Node backend must match)
        run: python -m pip install mutagen
      - name: Install dependencies
        run: npm ci
      - name: Real tag writer tests
        run: node --test tools/tests/tag-parity.test.js tools/tests/tag-node-backend.test.js tools/tests/tag-rules.test.js
