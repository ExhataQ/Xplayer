<!doctype html>
<html lang="en" data-theme="warm-graphite">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xplayer startup screen options</title>
    <link rel="stylesheet" href="../tokens.css">
    <link rel="stylesheet" href="../base.css">
    <link rel="stylesheet" href="../startup/startup.css">
    <style>
        body { overflow: auto; }
        .page { max-width: 1040px; margin: 0 auto; padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }
        .bar { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: center; padding: var(--space-4); background: var(--surface-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
        .group { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
        .group > span { color: var(--text-secondary); font-size: var(--text-sm); margin-right: var(--space-1); }
        .pill { height: var(--chip-height); padding: 0 var(--space-3); border: 0; border-radius: var(--radius-pill); background: var(--chip-bg); color: var(--text-primary); font-size: var(--text-sm); font-weight: var(--weight-medium); }
        .pill[aria-pressed='true'] { background: var(--chip-active-bg); color: var(--chip-active-fg); }
        .action { height: var(--button-height); padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--button-outline-border); background: transparent; font-weight: var(--weight-medium); }
        .action:hover { background: var(--surface-selected); }
        .note { color: var(--text-secondary); font-size: var(--text-sm); line-height: 1.55; max-width: 720px; }
        .frame { position: relative; height: 600px; border: 1px solid var(--border-strong); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface-ground); }
        .app-shell { position: absolute; inset: 0; display: grid; place-items: center; background: var(--surface-panel); color: var(--text-secondary); }
    </style>
</head>
<body>
    <div class="page">
        <header>
            <h1 style="font-family: var(--font-serif); font-weight: 400; font-size: var(--text-3xl);">Startup screen options</h1>
            <p class="note">Task A-09. These are the choices offered in Settings, "Startup screen". Switch theme and accent to see how each looks. The loading progress here is simulated.</p>
        </header>

        <div class="bar">
            <div class="group"><span>Background</span><div class="group" id="variants"></div></div>
            <div class="group"><span>Theme</span><div class="group" id="themes"></div></div>
            <div class="group"><span>Accent</span><div class="group" id="accents"></div></div>
            <div class="group"><button type="button" class="action" id="replay">Replay</button><button type="button" class="action" id="fullscreen">Full screen</button><button type="button" class="action" id="indeterminate">Unknown length</button></div>
        </div>

        <div class="frame" id="frame"></div>
    </div>
    <script type="module" src="startup-options.js"></script>
</body>
</html>
