<!doctype html>
<html lang="en" data-theme="warm-graphite">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xplayer design tokens</title>
    <link rel="stylesheet" href="../tokens.css">
    <link rel="stylesheet" href="../base.css">
    <style>
        body { overflow: auto; }
        .page { max-width: 1040px; margin: 0 auto; padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-8); }
        .bar { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: center; padding: var(--space-4); background: var(--surface-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); }
        .group { display: flex; gap: var(--space-2); align-items: center; }
        .group > span { color: var(--text-secondary); font-size: var(--text-sm); margin-right: var(--space-1); }
        .pill { height: var(--chip-height); padding: 0 var(--space-3); border: 0; border-radius: var(--radius-pill); background: var(--chip-bg); color: var(--text-primary); font-size: var(--text-sm); font-weight: var(--weight-medium); }
        .pill[aria-pressed='true'] { background: var(--chip-active-bg); color: var(--chip-active-fg); }
        section h2 { font-size: var(--text-lg); font-weight: var(--weight-semibold); margin-bottom: var(--space-3); }
        .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--space-3); }
        .swatch { border: 1px solid var(--border-strong); border-radius: var(--radius-lg); overflow: hidden; background: var(--surface-ground); }
        .swatch i { display: block; height: 44px; }
        .swatch span { display: block; padding: var(--space-2) var(--space-3); font-size: var(--text-xs); color: var(--text-secondary); }
        .icons { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: var(--space-2); }
        .icons div { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); padding: var(--space-3) var(--space-2); border-radius: var(--radius-md); background: var(--surface-panel); color: var(--text-primary); font-size: var(--text-xs); }
        .icons div span { color: var(--text-secondary); }
        .type > * { margin-bottom: var(--space-2); }
        .lyric { font-family: var(--font-serif); font-size: var(--text-4xl); line-height: 1.25; letter-spacing: -0.01em; }
    </style>
</head>
<body>
    <div class="page">
        <div class="bar">
            <div class="group" id="themes"><span>Theme</span></div>
            <div class="group" id="accents"><span>Accent</span></div>
        </div>

        <section>
            <h2>Colors in use</h2>
            <div class="swatches" id="swatches"></div>
        </section>

        <section class="type">
            <h2>Type</h2>
            <div class="lyric" dir="auto">The lamps come on along the pier</div>
            <div style="font-size: var(--text-3xl); font-weight: var(--weight-semibold); letter-spacing: -0.015em">Songs, 3,902</div>
            <div style="font-size: var(--text-lg); font-weight: var(--weight-semibold)">Library</div>
            <div style="font-size: var(--text-md); font-weight: var(--weight-medium)">Glass Harbour</div>
            <div style="font-size: var(--text-sm); color: var(--text-secondary)">Marlowe Quay, Slow Tide, 4:12 and 1:48 line up</div>
            <div style="font-size: var(--text-md)" dir="auto">متن تازه برای آزمایش خط راست به چپ</div>
        </section>

        <section>
            <h2>Icons</h2>
            <div class="icons" id="icons"></div>
        </section>
    </div>
    <script type="module" src="kitchen-sink.js"></script>
</body>
</html>
