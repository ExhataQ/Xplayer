<!doctype html>
<html lang="en" data-theme="warm-graphite">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Xplayer</title>
    <link rel="stylesheet" href="tokens.css">
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="components/components.css">
    <link rel="stylesheet" href="views/library/library-panel.css">
    <link rel="stylesheet" href="views/library/song-list.css">
    <link rel="stylesheet" href="views/library/search-view.css">
    <link rel="stylesheet" href="views/playback/player-bar.css">
    <link rel="stylesheet" href="shell/shell.css">
    <link rel="stylesheet" href="adapter/engine-view.css">
    <link rel="stylesheet" href="views/tools/dialogs.css">
    <link rel="stylesheet" href="views/tools/settings.css">
    <link rel="stylesheet" href="views/tools/lyrics.css">
    <link rel="stylesheet" href="views/tools/lyrics-editors.css">
    <link rel="stylesheet" href="views/tools/lyrics-find.css">
    <link rel="stylesheet" href="views/tools/metadata.css">
    <link rel="stylesheet" href="adapter/songlist-rows.css">
    <link rel="stylesheet" href="adapter/legacy-icons.css">
    <link rel="stylesheet" href="adapter/legacy-overlays.css">
</head>
<body>
    <div class="app">
        <!-- Title bar: the logo button, menu and bell are added by shell/shell.js. The slots are filled by the adapter. -->
        <header class="titlebar">
            <div class="titlebar__nav" data-legacy-slot="nav" style="display: contents"></div>
            <div class="titlebar__spacer"></div>
            <div class="titlebar__window" data-legacy-slot="window"></div>
        </header>

        <nav class="rail" aria-label="Main"></nav>

        <aside class="panel-host" aria-label="Panel">
            <div class="panel-host__header">
                <h2 class="panel-host__title"></h2>
            </div>
            <div class="panel-host__body"></div>
        </aside>

        <main class="view-host" id="view-host"></main>

        <footer class="player-host" aria-label="Player" data-legacy-slot="player"></footer>
    </div>

    <!-- The old panels the engine renders lists and queues into. Hidden; filled by the adapter. -->
    <div data-legacy-slot="host"></div>

    <!-- Order matters (ENGINE-CONTRACT.md): the adapter must build the engine's elements before js/main.js runs.
         Module scripts run in document order after the page is parsed. player.js is the classic build-data script. -->
    <script src="../player.js"></script>
    <script type="module">
        import { mountLegacyDom } from './adapter/legacy-dom-adapter.js';
        mountLegacyDom();
    </script>
    <script type="module" src="shell/shell.js"></script>
    <script type="module" src="../js/main.js"></script>
</body>
</html>
